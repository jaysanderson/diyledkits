<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 248 48" width="248" height="48" role="img" aria-label="DIY LED Kits">
  <title>DIY LED Kits horizontal lockup</title>
  <style>@import url('https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;700&amp;display=swap');</style>
  <defs>
    <linearGradient id="lh-g" x1="6" y1="0" x2="42" y2="0" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#F5A524"/>
      <stop offset="1" stop-color="#4FE3D6"/>
    </linearGradient>
    <filter id="lh-b" x="-50%" y="-150%" width="220%" height="400%"><feGaussianBlur stdDeviation="2.2"/></filter>
  </defs>
  <g filter="url(#lh-b)" opacity="0.6">
    <ellipse cx="23" cy="12" rx="5.2" ry="2.8" fill="#4FE3D6"/>
    <ellipse cx="31" cy="24" rx="5.2" ry="2.8" fill="#4FE3D6"/>
    <ellipse cx="43" cy="36" rx="5.2" ry="2.8" fill="#4FE3D6"/>
  </g>
  <rect x="6" y="8" width="16" height="8" rx="2" fill="url(#lh-g)"/>
  <rect x="6" y="20" width="24" height="8" rx="2" fill="url(#lh-g)"/>
  <rect x="6" y="32" width="36" height="8" rx="2" fill="url(#lh-g)"/>
  <text x="62" y="33" font-family="'Space Grotesk', 'Segoe UI', system-ui, sans-serif" font-size="27" letter-spacing="-1.1" fill="#F3EFE7"><tspan font-weight="700">DIY</tspan><tspan font-weight="500" fill="#A9A69E" dx="7">LED Kits</tspan></text>
</svg>
