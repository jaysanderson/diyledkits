<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="96" height="96" role="img" aria-label="DIY LED Kits mark">
  <title>DIY LED Kits mark</title>
  <desc>Three stepped light bars on a 24-unit grid. The bars read as cut lengths of LED strip and as steps; the glow bleeds off the right-hand end of each bar.</desc>
  <defs>
    <linearGradient id="mk-g" x1="3" y1="0" x2="21" y2="0" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#F5A524"/>
      <stop offset="1" stop-color="#4FE3D6"/>
    </linearGradient>
    <filter id="mk-b" x="-50%" y="-150%" width="220%" height="400%"><feGaussianBlur stdDeviation="1.1"/></filter>
  </defs>
  <g filter="url(#mk-b)" opacity="0.6">
    <ellipse cx="11.5" cy="6" rx="2.6" ry="1.4" fill="#4FE3D6"/>
    <ellipse cx="15.5" cy="12" rx="2.6" ry="1.4" fill="#4FE3D6"/>
    <ellipse cx="21.5" cy="18" rx="2.6" ry="1.4" fill="#4FE3D6"/>
  </g>
  <rect x="3" y="4" width="8" height="4" rx="1" fill="url(#mk-g)"/>
  <rect x="3" y="10" width="12" height="4" rx="1" fill="url(#mk-g)"/>
  <rect x="3" y="16" width="18" height="4" rx="1" fill="url(#mk-g)"/>
</svg>
