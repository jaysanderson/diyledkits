<script>
(function () {
  var P = JSON.parse(document.getElementById('payload').textContent);
  var ITER = 250000;
  function u8(b64) { var s = atob(b64), a = new Uint8Array(s.length); for (var i = 0; i < s.length; i++) a[i] = s.charCodeAt(i); return a; }
  async function unlock(pw) {
    var enc = new TextEncoder();
    var base = await crypto.subtle.importKey('raw', enc.encode(pw), 'PBKDF2', false, ['deriveKey']);
    var key = await crypto.subtle.deriveKey({ name: 'PBKDF2', salt: u8(P.salt), iterations: ITER, hash: 'SHA-256' }, base, { name: 'AES-GCM', length: 256 }, false, ['decrypt']);
    var pt = await crypto.subtle.decrypt({ name: 'AES-GCM', iv: u8(P.iv) }, key, u8(P.ct));
    return new TextDecoder().decode(pt);
  }
  function show(html) { document.open(); document.write(html); document.close(); }
  var input = document.getElementById('pw'), btn = document.getElementById('go'), err = document.getElementById('err');
  async function attempt(pw, silent) {
    btn.disabled = true; err.textContent = '';
    try { var html = await unlock(pw); try { sessionStorage.setItem('dlk-preview', pw); } catch (e) {} show(html); }
    catch (e) { btn.disabled = false; if (!silent) { err.textContent = 'That password did not unlock the preview.'; input.select(); } }
  }
  btn.addEventListener('click', function () { attempt(input.value, false); });
  input.addEventListener('keydown', function (e) { if (e.key === 'Enter') attempt(input.value, false); });
  try { var saved = sessionStorage.getItem('dlk-preview'); if (saved) attempt(saved, true); } catch (e) {}
})();
</script>
